# Builds Phun's PHP 8.4 / 8.5 / 8.6 (cli + fpm) from the php.net source with
# static-php-cli and publishes them on a public release that Phun setup
# downloads from. Manual only: run it from the Actions tab.
#
# Publishes to this repo's Releases (tag php-<version>) with the built-in token.
# After it finishes, run Phun's `scripts/pin-php.sh <tag>` for each version tag.
# `minors` picks what to build ("8.6" alone, say). Untick publish for a test build
# (a release candidate, say): the archives stay as run artifacts only.
name: php-build

on:
  workflow_dispatch:
    inputs:
      php84:
        description: PHP 8.4 patch version
        default: "8.4.27"
      php84_sha256:
        description: SHA-256 of php-<php84>.tar.gz from php.net
        default: "5bafed9994c1a49796b25b5f61c22c9183bfe046b6acc7b363842d03c77f972f"
      php85:
        description: PHP 8.5 patch version
        default: "8.5.12"
      php85_sha256:
        description: SHA-256 of php-<php85>.tar.gz from php.net
        default: "81a0f450349e84b08eb43faa85f8a4c835684f3cc1c50471775d1317a046c525"
      minors:
        description: Which minors to build, space separated
        default: "8.4 8.5"
      php86:
        description: PHP 8.6 version (8.6.0RC7 for a release candidate)
        default: ""
      php86_sha256:
        description: SHA-256 of php-<php86>.tar.gz
        default: ""
      php86_url:
        description: Where php-<php86>.tar.gz is, when not php.net/distributions (release candidates are on downloads.php.net)
        default: ""
      publish:
        description: Publish a release per version (untick for a test build)
        type: boolean
        default: true

permissions:
  contents: read

env:
  SPC_VERSION: "2.8.5"
  # No swoole: it pulls in c-ares, and a c-ares libcurl ignores /etc/hosts-style
  # resolution that .test sites rely on. No --with-suggested-libs for the same
  # reason, so libcurl uses the system resolver. No imap: it left PHP core in
  # 8.4 and its PECL source clashes with the pinned php.net tarball.
  # mbregex is mbstring's regex half (mb_split, mb_ereg): static-php-cli lists
  # it separately, and without it PHP is configured with --disable-mbregex,
  # which Laravel's Str::headline and Filament's labels fall over on.
  # memcached (with libmemcached) is what Laravel's memcached cache store
  # needs; the older memcache extension is not enough.
  # nghttp2 gives libcurl HTTP/2, which Apple push (APNs) needs: Laravel's
  # HTTP client refuses HTTP/2 requests without it ("libcurl 7.65.2 or newer
  # built with HTTP/2 support is required"). Named on its own because the
  # suggested libs stay off (see c-ares above).
  PHP_LIBS: "nghttp2"
  PHP_EXTENSIONS: "apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,event,exif,fileinfo,filter,ftp,gd,gmp,iconv,imagick,intl,mbstring,mbregex,memcached,mysqli,mysqlnd,opcache,openssl,opentelemetry,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,protobuf,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      minors: ${{ steps.minors.outputs.minors }}
    steps:
      - id: minors
        run: |
          set -euo pipefail
          minors=()
          for m in ${{ inputs.minors }}; do
            case "$m" in
              8.4|8.5|8.6) minors+=("\"$m\"") ;;
              *) echo "unknown minor $m"; exit 1 ;;
            esac
          done
          [ "${#minors[@]}" -gt 0 ] || { echo "no minor given"; exit 1; }
          echo "minors=[$(IFS=,; echo "${minors[*]}")]" >> "$GITHUB_OUTPUT"

  build:
    name: php-${{ matrix.minor }} ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        minor: ${{ fromJSON(needs.plan.outputs.minors) }}
        platform: [linux-x86_64, linux-aarch64, macos-aarch64, macos-x86_64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Pick version
        run: |
          case "${{ matrix.minor }}" in
            8.4) v="${{ inputs.php84 }}"; sum="${{ inputs.php84_sha256 }}"; url="" ;;
            8.5) v="${{ inputs.php85 }}"; sum="${{ inputs.php85_sha256 }}"; url="" ;;
            8.6) v="${{ inputs.php86 }}"; sum="${{ inputs.php86_sha256 }}"; url="${{ inputs.php86_url }}" ;;
          esac
          [ -n "$sum" ] || { echo "no SHA-256 given for PHP $v"; exit 1; }
          echo "PHP_VERSION=$v" >> "$GITHUB_ENV"
          echo "PHP_SHA256=$sum" >> "$GITHUB_ENV"
          echo "PHP_URL=${url:-https://www.php.net/distributions/php-$v.tar.gz}" >> "$GITHUB_ENV"

      - name: static-php-cli source
        run: |
          git clone --depth 1 --branch "$SPC_VERSION" https://github.com/crazywhalecc/static-php-cli.git "$RUNNER_TEMP/spc"

      # static-php-cli 2.8.5 predates PHP 8.6:
      # its versioned phpmicro patch lookup stops at 8.5 (so 8.6 falls back
      # to the 8.0 patches, which no longer apply), and cli_checks, a patch
      # only phpmicro builds need, has no version that fits 8.6. Add 8.6 to
      # the lookup, so it uses the 8.4 disable_huge_page and macos_iconv
      # patches, and drop cli_checks.
      # PHP 8.6's configure refuses Libtool's --with-pic; it is --enable-pic.
      # Extensions whose releases do not build against 8.6 yet (8.6 removed
      # XtOffsetOf, zval_dtor, INI_STR and other old internal aliases):
      # APCu, imagick, memcached and redis come from pinned commits of their
      # main branches, which do; event from its 3.2.0 release, newer than the
      # one spc pins. protobuf has no 8.6-ready version at all, so its
      # 5.36.2 release is built with zval_dtor() renamed to
      # zval_ptr_dtor_nogc(), the function it was an alias of.
      - name: static-php-cli for PHP 8.6
        if: matrix.minor == '8.6'
        working-directory: ${{ runner.temp }}/spc
        run: |
          set -euo pipefail
          grep -q "'84', '85']" src/SPC/store/SourcePatcher.php
          perl -0pi -e "s/'84', '85'\]/'84', '85', '86']/" src/SPC/store/SourcePatcher.php
          perl -pi -e 's/^SPC_MICRO_PATCHES=cli_checks,/SPC_MICRO_PATCHES=/' config/env.ini
          perl -pi -e 's/^(SPC_CMD_PREFIX_PHP_CONFIGURE=.*) --with-pic"/$1 --enable-pic"/' config/env.ini
          {
            printf 'SPC_EXTRA_SOURCES='
            printf -- '--custom-url apcu:https://github.com/krakjoe/apcu/archive/fb2c942552a3f5dab7f4dea4afb5cf0831222c57.tar.gz '
            printf -- '--custom-url ext-imagick:https://github.com/Imagick/imagick/archive/55ed2e9fda264395636a2e27e51f31673f5566ab.tar.gz '
            printf -- '--custom-url memcached:https://github.com/php-memcached-dev/php-memcached/archive/0b52d3657140750fa0eddd20cdbfc6edc8fbdadd.tar.gz '
            printf -- '--custom-url redis:https://github.com/phpredis/phpredis/archive/9b4b2ef6aa7537f16a3e37cf548a7ad533fa1e82.tar.gz '
            printf -- '--custom-url ext-event:https://bitbucket.org/osmanov/pecl-event/get/3.2.0.tar.gz\n'
          } >> "$GITHUB_ENV"
          mkdir -p downloads/protobuf-86
          curl -fsSL --retry 3 -o downloads/protobuf-86/src.tgz https://pecl.php.net/get/protobuf-5.36.2.tgz
          tar -xzf downloads/protobuf-86/src.tgz -C downloads/protobuf-86
          rm downloads/protobuf-86/src.tgz
          grep -rl 'zval_dtor(' downloads/protobuf-86 | xargs perl -pi -e 's/\bzval_dtor\(/zval_ptr_dtor_nogc(/g'
          if grep -rq 'zval_dtor(' downloads/protobuf-86; then echo "zval_dtor left in protobuf"; exit 1; fi
          tar -czf downloads/protobuf-86.tgz -C downloads/protobuf-86 protobuf-5.36.2
          rm -rf downloads/protobuf-86
          echo "SPC_PROTOBUF_FILE=protobuf-86.tgz" >> "$GITHUB_ENV"
          grep -n "'86'" src/SPC/store/SourcePatcher.php
          grep -n "^SPC_MICRO_PATCHES\|^SPC_CMD_PREFIX_PHP_CONFIGURE" config/env.ini

      # Kept under downloads/, which spc-gnu-docker mounts at /app/downloads.
      - name: php.net source (checked)
        working-directory: ${{ runner.temp }}/spc
        run: |
          mkdir -p downloads/php-src-in
          curl -fsSL --retry 3 -o "downloads/php-src-in/php-$PHP_VERSION.tar.gz" "$PHP_URL"
          echo "$PHP_SHA256  downloads/php-src-in/php-$PHP_VERSION.tar.gz" | shasum -a 256 -c -

      - name: PHP + composer for spc (macOS)
        if: startsWith(matrix.platform, 'macos-')
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Build (macOS)
        if: startsWith(matrix.platform, 'macos-')
        working-directory: ${{ runner.temp }}/spc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer install --no-dev --no-interaction --prefer-dist
          bin/spc doctor --auto-fix
          bin/spc download --with-php="${{ matrix.minor }}" --for-extensions="$PHP_EXTENSIONS" \
            --custom-url "php-src:file://$PWD/downloads/php-src-in/php-$PHP_VERSION.tar.gz" $SPC_EXTRA_SOURCES \
            ${SPC_PROTOBUF_FILE:+--custom-url "protobuf:file://$PWD/downloads/$SPC_PROTOBUF_FILE"} --retry 3
          bin/spc build "$PHP_EXTENSIONS" --with-libs="$PHP_LIBS" --build-cli --build-fpm

      # glibc build in spc's own container, so php can dlopen the bundled
      # pcov.so (a fully static musl php cannot load shared extensions).
      - name: Build (Linux, glibc)
        if: startsWith(matrix.platform, 'linux-')
        working-directory: ${{ runner.temp }}/spc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bin/spc-gnu-docker download --with-php="${{ matrix.minor }}" --for-extensions="$PHP_EXTENSIONS" \
            --custom-url "php-src:file:///app/downloads/php-src-in/php-$PHP_VERSION.tar.gz" $SPC_EXTRA_SOURCES \
            ${SPC_PROTOBUF_FILE:+--custom-url "protobuf:file:///app/downloads/$SPC_PROTOBUF_FILE"} --retry 3
          bin/spc-gnu-docker build "$PHP_EXTENSIONS" --with-libs="$PHP_LIBS" --build-cli --build-fpm

      # spc keeps configure and compiler output in its own log files, not
      # the job log, so keep them when a build fails.
      - name: Keep spc logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-logs-${{ matrix.minor }}-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/spc/log/
            ${{ runner.temp }}/spc/source/php-src/config.log
          if-no-files-found: ignore

      - name: Stage
        run: |
          src="$RUNNER_TEMP/spc/buildroot/bin"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/bin" "$stage/sbin" dist
          cp "$src/php" "$stage/bin/php"
          cp "$src/php-fpm" "$stage/sbin/php-fpm"
          chmod 755 "$stage/bin/php" "$stage/sbin/php-fpm"

      - name: Verify
        run: |
          php="$RUNNER_TEMP/stage/bin/php"
          "$php" -v
          "$php" -v | grep -q "PHP $PHP_VERSION"
          "$php" -i | grep -q "Thread Safety => disabled"
          mods=$("$php" -m)
          for m in pdo_sqlite pdo_pgsql sqlite3 pgsql curl openssl intl mbstring memcached; do
            echo "$mods" | grep -qx "$m" || { echo "missing module $m"; exit 1; }
          done
          # mbregex is not a module of its own; its functions are the only sign of it.
          "$php" -n -r 'exit(function_exists("mb_split") && function_exists("mb_ereg") ? 0 : 1);' \
            || { echo "mbstring was built without mbregex (mb_split missing)"; exit 1; }
          "$RUNNER_TEMP/stage/sbin/php-fpm" -v
          if grep -aq "c-ares" "$php"; then echo "libcurl was built with c-ares"; exit 1; fi
          "$php" -n -r '$c = curl_version(); exit(($c["features"] & CURL_VERSION_HTTP2) && version_compare($c["version"], "7.65.2", ">=") ? 0 : 1);' \
            || { echo "libcurl was built without HTTP/2 (nghttp2)"; exit 1; }

      - name: Package
        run: |
          name="php-$PHP_VERSION-${{ matrix.platform }}.tar.gz"
          tar --owner=0 --group=0 -C "$RUNNER_TEMP/stage" -czf "dist/$name" bin sbin 2>/dev/null \
            || tar -C "$RUNNER_TEMP/stage" -czf "dist/$name" bin sbin
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.minor }}-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release per version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          for m in ${{ inputs.minors }}; do
            case "$m" in
              8.4) v="${{ inputs.php84 }}" ;;
              8.5) v="${{ inputs.php85 }}" ;;
              8.6) v="${{ inputs.php86 }}" ;;
            esac
            tag="php-$v"
            files=(php-"$v"-*.tar.gz)
            [ "${#files[@]}" -eq 4 ] || { echo "$tag: expected 4 archives, got ${#files[@]}"; exit 1; }
            sha256sum "${files[@]}" > "SHA256SUMS-$v"
            cat "SHA256SUMS-$v"
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              echo "$tag already exists on $REPO; delete it first to rebuild"; exit 1
            fi
            cp "SHA256SUMS-$v" SHA256SUMS
            gh release create "$tag" --repo "$REPO" --title "PHP $v" \
              --notes "PHP $v for Phun (cli + fpm, NTS), built from the php.net source with static-php-cli $SPC_VERSION." \
              "${files[@]}" SHA256SUMS
          done
